version: "3.9"

# Local development stack.
# `docker compose up -d db` is enough to develop — the API and web apps can then be
# run natively with `npm run dev`. `docker compose --profile app up -d` runs everything.

services:
  db:
    image: postgres:16-alpine
    container_name: erp_crm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_password}
      POSTGRES_DB: ${POSTGRES_DB:-erp_crm}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp_user} -d ${POSTGRES_DB:-erp_crm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for local development and the test suite.
  # The application code is plain AWS SDK v3 — pointing S3_ENDPOINT at real AWS
  # (i.e. leaving it unset) is the only difference in production.
  storage:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: erp_crm_storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-erp_minio_user}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-erp_minio_password}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job that creates the bucket MinIO needs before the API starts.
  storage-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: erp_crm_storage_init
    depends_on:
      storage:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:-erp-crm-product-images}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-erp_minio_user}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-erp_minio_password}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 $${S3_ACCESS_KEY_ID} $${S3_SECRET_ACCESS_KEY} &&
      mc mb --ignore-existing local/$${S3_BUCKET} &&
      mc anonymous set download local/$${S3_BUCKET} &&
      echo 'bucket ready';
      "

  api:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp_crm_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-erp_user}:${POSTGRES_PASSWORD:-erp_password}@db:5432/${POSTGRES_DB:-erp_crm}
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-Password@123}
    ports:
      - "4000:4000"

  web:
    profiles: ["app"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000/api/v1}
    container_name: erp_crm_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  pgdata:
  miniodata:
