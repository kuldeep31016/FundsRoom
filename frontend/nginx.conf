server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app: unknown paths must fall through to index.html so deep links
  # such as /challans/<id> keep working on a hard refresh.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Asset filenames are content-hashed by Vite, so they are safe to cache forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
