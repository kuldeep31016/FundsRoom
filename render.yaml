# Render blueprint: provisions the API and the static frontend in one go.
# Import this repository at https://render.com → New → Blueprint.
#
# The database is deliberately NOT provisioned here. Render's free PostgreSQL
# expires after roughly 30 days, which would leave a submitted demo pointing at a
# dead database. Instead, create a free database on Neon (or Supabase) and paste
# its connection string into the DATABASE_URL field when deploying the blueprint.

services:
  # ---- Backend API --------------------------------------------------------
  - type: web
    name: erp-crm-api
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev is required: NODE_ENV=production below makes a bare `npm ci`
    # skip devDependencies, and TypeScript lives there, so the build would fail
    # with "tsc: command not found". Only compiled JS and production
    # dependencies are needed at runtime.
    buildCommand: npm ci --include=dev && npm run build
    # Migrations run on every deploy; the runner is idempotent and skips
    # anything already applied. The seed only inserts demo data on an empty DB.
    startCommand: npm run migrate:prod && npm run seed:prod && npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      # Paste the connection string from Neon/Supabase. Never commit it.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      # Replace with the deployed frontend origin once it is known.
      - key: CORS_ORIGINS
        sync: false
      - key: SEED_DEFAULT_PASSWORD
        sync: false

  # ---- Frontend (static site) --------------------------------------------
  - type: web
    name: erp-crm-web
    runtime: static
    rootDir: frontend
    # Vite and TypeScript are devDependencies, so the same --include=dev applies.
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      # Must point at the deployed API, including the /api/v1 suffix.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
