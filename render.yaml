# Render blueprint: provisions the PostgreSQL database, the API and the static
# frontend in one go. Import this repository at https://render.com → New → Blueprint.
databases:
  - name: erp-crm-db
    databaseName: erp_crm
    user: erp_user
    plan: free

services:
  # ---- Backend API --------------------------------------------------------
  - type: web
    name: erp-crm-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    # Migrations run on every deploy; the runner is idempotent and skips
    # anything already applied. The seed only inserts demo data on an empty DB.
    startCommand: npm run migrate:prod && npm run seed:prod && npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: erp-crm-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      # Replace with the deployed frontend origin once it is known.
      - key: CORS_ORIGINS
        sync: false
      - key: SEED_DEFAULT_PASSWORD
        sync: false

  # ---- Frontend (static site) --------------------------------------------
  - type: web
    name: erp-crm-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Must point at the deployed API, including the /api/v1 suffix.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
