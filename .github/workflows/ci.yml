name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — typecheck, migrate, test
    runs-on: ubuntu-latest

    # A throwaway PostgreSQL instance so the suite runs against the real engine
    # (constraints, transactions and row locks are the point of these tests).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp_user
          POSTGRES_PASSWORD: erp_password
          POSTGRES_DB: erp_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_user -d erp_crm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://erp_user:erp_password@localhost:5432/erp_crm_test
      TEST_DATABASE_URL: postgres://erp_user:erp_password@localhost:5432/erp_crm_test
      JWT_SECRET: ci-only-secret-value-not-used-anywhere-else
      SEED_DEFAULT_PASSWORD: Password@123

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run migrations
        run: npm run migrate

      - name: Run integration tests
        run: npm test

  frontend:
    name: Frontend — typecheck and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://example.invalid/api/v1

  secrets-check:
    name: Ensure no secrets are committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a .env file is tracked
        run: |
          if git ls-files --error-unmatch '**/.env' >/dev/null 2>&1; then
            echo "::error::A .env file is committed to the repository"
            exit 1
          fi
          echo "No tracked .env files found."
